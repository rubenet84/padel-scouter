{# _sidebar_menu_simple.html — Menú lateral sin IA ni Planes (dashboard/global-stats) #}
<div id="sidebar">
  <div class="p-5 space-y-1">
    <div class="flex justify-end mb-5">
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-lg bg-purple-800/30 border border-purple-500/15 flex items-center justify-center hover:bg-purple-800/50 transition-colors">
        <span class="iconify text-purple-300/60 text-lg" data-icon="mdi:close"></span>
      </button>
    </div>

    <div class="text-[10px] text-white/70 tracking-widest uppercase font-semibold px-3 mb-3">Principal</div>
    <a href="/dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:view-dashboard-outline"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Mi Dashboard</span>
    </a>
    <a href="/global-stats#top-section" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:account-group-outline"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Top Jugadores</span>
    </a>
    <a href="/global-stats#ranking-title" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:trophy-outline"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Rankings</span>
    </a>
    <a href="/global-stats" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:chart-box-outline"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Estadísticas</span>
    </a>

    <div class="text-[10px] text-white/70 tracking-widest uppercase font-semibold px-3 mb-3 mt-6">Social</div>
    <a href="/global-stats#records-section" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:trophy-award"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Récords de la Comunidad</span>
    </a>

    <div class="text-[10px] text-white/70 tracking-widest uppercase font-semibold px-3 mb-3 mt-6" id="sidebar-admin-group" style="display:none;">Administración</div>
    <a href="/admin/users" id="sidebar-admin" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg" style="display:none;">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:shield-account"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Gestión de Usuarios</span>
    </a>
    <script>
    (function () {
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + t } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (u) {
          if (u && u.role === 'admin') {
            var g = document.getElementById('sidebar-admin-group');
            var a = document.getElementById('sidebar-admin');
            if (g) g.style.display = '';
            if (a) a.style.display = '';
          }
        })
        .catch(function () {});
    })();
    </script>

    <a href="/login" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-r-lg" onclick="localStorage.clear()">
      <span class="iconify link-icon text-purple-300/70 text-lg" data-icon="mdi:logout"></span>
      <span class="link-text text-sm text-purple-200/80 font-medium">Cerrar Sesión</span>
    </a>
  </div>
  <div class="absolute bottom-0 left-0 right-0 p-5 border-t border-purple-500/8">
    <div class="flex items-center gap-2">
      <div class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></div>
      <span class="text-[10px] text-white/60 font-mono tracking-wider">SYSTEM ONLINE — v2.4.1</span>
    </div>
  </div>
</div>
